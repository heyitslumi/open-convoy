[package]
name = "convoy-server"
version = "0.1.0"
edition = "2021"

[dependencies]
convoy-proto = { path = "../convoy-proto" }
convoy-steam = { path = "../convoy-steam" }
tokio = { version = "1.36", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
thiserror = "1.0"
bytes = "1.5"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
